server:
  port: ${PORT:8080}

spring:
  application:
    name: wallet-ledger
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: wallet-ledger-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:wallet-ledger}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  swagger:
    auto-open: ${SWAGGER_AUTO_OPEN:true}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    persist-authorization: true
    try-it-out-enabled: true
